name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - '.github/workflows/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'nginx.conf'
      - 'scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - '.github/workflows/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'nginx.conf'
      - 'scripts/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.20.1
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.1'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter le lint
        run: npm run lint

      - name: Exécuter les tests
        run: npm run test:ci

      - name: Build Angular de production
        run: npm run build:prod

      - name: Auditer les dépendances de production
        run: npm run audit

      - name: Publier l'artefact dist (debug)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
