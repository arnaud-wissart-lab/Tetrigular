name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - '.github/workflows/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'nginx.conf'
      - 'scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - '.github/workflows/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'nginx.conf'
      - 'scripts/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: [self-hosted, linux, ci]
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Détecter les scripts NPM disponibles
        id: detect-scripts
        run: |
          node <<'NODE' > "$GITHUB_OUTPUT"
          const scripts = require('./package.json').scripts || {};
          const has = (name) => typeof scripts[name] === 'string' && scripts[name].trim() !== '';
          console.log(`has_lint=${has('lint')}`);
          console.log(`has_test_ci=${has('test:ci')}`);
          console.log(`has_test=${has('test')}`);
          console.log(`has_build_prod=${has('build:prod')}`);
          console.log(`has_build=${has('build')}`);
          NODE

      - name: Exécuter le lint
        if: steps.detect-scripts.outputs.has_lint == 'true'
        run: npm run lint

      - name: Build Angular (production)
        if: steps.detect-scripts.outputs.has_build_prod == 'true'
        run: npm run build:prod

      - name: Build Angular (fallback)
        if: steps.detect-scripts.outputs.has_build_prod != 'true' && steps.detect-scripts.outputs.has_build == 'true'
        run: npm run build

      - name: Exécuter les tests (test:ci)
        if: steps.detect-scripts.outputs.has_test_ci == 'true'
        run: npm run test:ci

      - name: Exécuter les tests (fallback test)
        if: steps.detect-scripts.outputs.has_test_ci != 'true' && steps.detect-scripts.outputs.has_test == 'true'
        run: npm test -- --watch=false --progress=false

      - name: Publier l'artefact dist (debug)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
