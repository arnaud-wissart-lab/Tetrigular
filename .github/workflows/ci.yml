name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - 'scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - 'scripts/**'

jobs:
  ci:
    runs-on: [self-hosted, linux, ci]
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Vérifier la présence du script test
        id: detect-tests
        run: |
          if node -e "const scripts=require('./package.json').scripts||{}; process.exit(typeof scripts.test==='string' && scripts.test.trim() !== '' ? 0 : 1)"; then
            echo "has_test=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_test=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Exécuter les tests
        if: steps.detect-tests.outputs.has_test == 'true'
        run: npm test -- --watch=false --progress=false

      - name: Publier l'artefact dist (debug)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
