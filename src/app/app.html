@let gameState = state();

<main class="layout">
  <header class="header">
    <h1>Tetris Angular</h1>
    <p>Standalone + TypeScript strict</p>
  </header>

  <section class="content">
    <app-tetris-board [board]="board()"></app-tetris-board>
    <app-tetris-controls
      [status]="gameState.status"
      [score]="gameState.score"
      [lines]="gameState.lines"
      [level]="gameState.level"
      [nextPiece]="gameState.nextPiece"
      (newGame)="resetGame()"
      (pauseToggle)="togglePause()"
    ></app-tetris-controls>
  </section>
</main>
