<aside class="panel" aria-label="Informations de partie">
  <h2>Tetris</h2>

  <dl class="stats">
    <div>
      <dt>Score</dt>
      <dd>{{ score() }}</dd>
    </div>
    <div>
      <dt>Lignes</dt>
      <dd>{{ lines() }}</dd>
    </div>
    <div>
      <dt>Niveau</dt>
      <dd>{{ level() }}</dd>
    </div>
    <div>
      <dt>Prochaine</dt>
      <dd>{{ nextPiece() }}</dd>
    </div>
  </dl>

  <div class="actions">
    <button type="button" (click)="newGame.emit()">Nouvelle partie</button>
    <button type="button" [disabled]="status() === 'game-over'" (click)="pauseToggle.emit()">
      {{ pauseLabel() }}
    </button>
  </div>

  <p class="status" [class.status--danger]="status() === 'game-over'">État : {{ statusLabel() }}</p>
  <p class="controls">Commandes: gauche/droite, haut, bas, Espace, P, R.</p>
</aside>
