<section class="hud">
  <h2>Tableau de bord</h2>

  <dl class="stats">
    <div>
      <dt>État</dt>
      <dd>{{ statusLabel() }}</dd>
    </div>
    <div>
      <dt>Score</dt>
      <dd>{{ score() }}</dd>
    </div>
    <div>
      <dt>Lignes</dt>
      <dd>{{ lines() }}</dd>
    </div>
    <div>
      <dt>Niveau</dt>
      <dd>{{ level() }}</dd>
    </div>
  </dl>

  <p class="keys">←/→: déplacer | ↑: pivoter | ↓: accélérer | Espace: lâcher | P: pause</p>
</section>
