<section class="hud">
  <h2>Scoreboard</h2>

  <dl class="stats">
    <div>
      <dt>État</dt>
      <dd>{{ statusLabel() }}</dd>
    </div>
    <div>
      <dt>Score</dt>
      <dd>{{ score() }}</dd>
    </div>
    <div>
      <dt>Lignes</dt>
      <dd>{{ lines() }}</dd>
    </div>
    <div>
      <dt>Niveau</dt>
      <dd>{{ level() }}</dd>
    </div>
  </dl>

  <p class="keys">P: pause | Espace: hard drop | Z/X: rotation</p>
</section>
