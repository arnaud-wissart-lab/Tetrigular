@if (visible()) {
  <div class="overlay">
    @switch (status()) {
      @case ('idle') {
        <h2>Tetrigular</h2>
        <p>Clique puis joue au clavier.</p>
        <button type="button" (click)="startRequested.emit()">Start</button>
      }
      @case ('paused') {
        <h2>Pause</h2>
        <p>Appuie sur P ou reprends ici.</p>
        <button type="button" (click)="resumeRequested.emit()">Reprendre</button>
      }
      @case ('gameOver') {
        <h2>Game Over</h2>
        <p>Relance une partie.</p>
        <button type="button" (click)="restartRequested.emit()">Restart</button>
      }
    }
  </div>
}
