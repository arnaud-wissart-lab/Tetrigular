<div class="board" role="grid" aria-label="Plateau Tetris">
  @for (row of board(); track $index) {
    <div class="row" role="row">
      @for (cell of row; track $index) {
        <span
          class="cell"
          role="gridcell"
          [ngClass]="cell ? 'cell--' + cell.toLowerCase() : 'cell--empty'"
        ></span>
      }
    </div>
  }
</div>
