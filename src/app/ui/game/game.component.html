<main class="game-page">
  <section class="board-section">
    <header class="title">
      <h1>Tetrigular</h1>
      <p>Canvas 2D + GameEngine découplé</p>
    </header>

    <div class="board-shell">
      <canvas
        #boardCanvas
        class="board-canvas"
        tabindex="0"
        aria-label="Plateau de jeu Tetris"
        (pointerdown)="focusCanvas()"
      ></canvas>

      <app-overlay
        [status]="status()"
        (startRequested)="startGame()"
        (restartRequested)="restartGame()"
        (resumeRequested)="resumeGame()"
      ></app-overlay>
    </div>
  </section>

  <aside class="side-panel">
    <app-hud [status]="status()" [score]="score()" [lines]="lines()" [level]="level()"></app-hud>

    <app-next-piece [nextPiece]="nextPiece()" [theme]="theme()"></app-next-piece>

    <section class="theme-panel" aria-label="Options de thème">
      <h2>Thème</h2>
      <div class="theme-actions">
        <button
          type="button"
          class="theme-btn"
          [class.theme-btn--active]="theme() === 'day'"
          (click)="setTheme('day')"
        >
          <span class="theme-btn-content">
            <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4.5"></circle>
              <path d="M12 2.5v3"></path>
              <path d="M12 18.5v3"></path>
              <path d="M2.5 12h3"></path>
              <path d="M18.5 12h3"></path>
              <path d="m5.2 5.2 2.1 2.1"></path>
              <path d="m16.7 16.7 2.1 2.1"></path>
              <path d="m18.8 5.2-2.1 2.1"></path>
              <path d="m7.3 16.7-2.1 2.1"></path>
            </svg>
            <span>Jour</span>
          </span>
        </button>
        <button
          type="button"
          class="theme-btn"
          [class.theme-btn--active]="theme() === 'night'"
          (click)="setTheme('night')"
        >
          <span class="theme-btn-content">
            <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.2a8 8 0 1 1-10.2-10 7 7 0 1 0 10.2 10z"></path>
              <path d="M16.5 4.4v2.2"></path>
              <path d="M15.4 5.5h2.2"></path>
            </svg>
            <span>Nuit</span>
          </span>
        </button>
      </div>
    </section>

    <button type="button" class="restart-btn" (click)="restartGame()">Restart</button>
  </aside>
</main>
